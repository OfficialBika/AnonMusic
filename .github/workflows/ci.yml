name: CI

on:
  push:
    branches: ["master", "fix/**"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system requirements for import-time checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile Python source
        run: uv run python -m compileall -q anony config.py tests
      - name: Run unit tests
        env:
          API_ID: "123"
          API_HASH: "test-hash"
          BOT_TOKEN: "123:test-token"
          MONGO_URL: "mongodb://localhost:27017"
          LOGGER_ID: "-100123456789"
          OWNER_ID: "123456789"
          SESSION: "test-session"
        run: uv run python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t anonmusic:ci .
